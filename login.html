<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyHub Pakistan - Admin Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#eff6ff,#f5f3ff);
    padding:20px;
}

.login-box{
    width:100%;
    max-width:410px;
    background:white;
    padding:35px;
    border-radius:18px;
    box-shadow:0 10px 40px rgba(0,0,0,.12);
}

.logo{
    text-align:center;
    font-size:26px;
    font-weight:bold;
    color:#172033;
    margin-bottom:8px;
}

.logo span{
    color:#2563eb;
}

.subtitle{
    text-align:center;
    color:#697386;
    margin-bottom:30px;
    font-size:14px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
    font-size:14px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #d5dbe7;
    border-radius:8px;
    outline:none;
    font-size:14px;
}

input:focus{
    border-color:#2563eb;
}

button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    margin-top:16px;
    padding:11px;
    border-radius:8px;
    text-align:center;
    font-size:13px;
    display:none;
}

.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#2563eb;
    text-decoration:none;
    font-size:14px;
}

.back:hover{
    text-decoration:underline;
}

.loading{
    text-align:center;
    margin-top:15px;
    color:#697386;
    font-size:13px;
    display:none;
}

@media(max-width:450px){

    .login-box{
        padding:25px 20px;
    }

    .logo{
        font-size:23px;
    }

}

</style>

</head>

<body>


<div class="login-box">

    <div class="logo">
        Study<span>Hub</span> Pakistan
    </div>

    <div class="subtitle">
        🔐 Admin Login
    </div>


    <form id="loginForm">


        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required>

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required>

        </div>


        <button
            id="loginBtn"
            type="submit">

            🔐 Login

        </button>


    </form>


    <div
        id="loading"
        class="loading">

        Please wait...

    </div>


    <div
        id="message"
        class="message">
    </div>


    <a
        href="index.html"
        class="back">

        ← Back to StudyHub

    </a>

</div>



<script>

/* =====================================
   SUPABASE CONFIGURATION
===================================== */

const SUPABASE_URL =
"https://kwkxdvevtxyvjywiqkcv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5xL_Po0vDkNM_sMHz6zBTg_HhV1r0zT";


/* =====================================
   CREATE SUPABASE CLIENT
===================================== */

const db =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================
   GET HTML ELEMENTS
===================================== */

const form =
document.getElementById("loginForm");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const message =
document.getElementById("message");

const loading =
document.getElementById("loading");


/* =====================================
   SHOW MESSAGE
===================================== */

function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;

}


/* =====================================
   LOGIN FORM
===================================== */

form.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        /* Clear old message */

        message.className = "message";
        message.textContent = "";


        /* Get values */

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        /* Check fields */

        if(!email || !password){

            showMessage(
                "Please enter email and password.",
                "error"
            );

            return;
        }


        /* Disable button */

        loginBtn.disabled = true;

        loginBtn.textContent =
            "⏳ Logging in...";

        loading.style.display =
            "block";


        try{


            /* =================================
               SUPABASE LOGIN
            ================================= */

            const {
                data,
                error
            } =
            await db.auth.signInWithPassword({

                email:email,

                password:password

            });


            /* Login error */

            if(error){

                throw error;

            }


            /* Check user */

            if(!data || !data.user){

                throw new Error(
                    "User account not found."
                );

            }


            const userId =
                data.user.id;


            /* =================================
               CHECK ADMIN ROLE
            ================================= */

            const {
                data:profile,
                error:profileError
            } =
            await db
            .from("profiles")
            .select("id,email,role")
            .eq("id",userId)
            .maybeSingle();


            /* Profile error */

            if(profileError){

                console.error(
                    "Profile error:",
                    profileError
                );

                await db.auth.signOut();

                throw new Error(
                    "Could not check admin profile."
                );

            }


            /* Profile doesn't exist */

            if(!profile){

                await db.auth.signOut();

                throw new Error(
                    "Your profile was not found."
                );

            }


            /* =================================
               CHECK ROLE
            ================================= */

            if(profile.role !== "admin"){

                await db.auth.signOut();

                throw new Error(
                    "This account is not an admin."
                );

            }


            /* =================================
               ADMIN LOGIN SUCCESS
            ================================= */

            showMessage(
                "✅ Login successful! Opening Admin Panel...",
                "success"
            );


            /* Save information */

            localStorage.setItem(
                "studyhub_user_id",
                userId
            );

            localStorage.setItem(
                "studyhub_role",
                "admin"
            );


            /* =================================
               OPEN ADMIN PAGE
            ================================= */

            setTimeout(function(){

                window.location.href =
                    "admin.html";

            },800);


        }

        catch(error){

            console.error(
                "LOGIN ERROR:",
                error
            );


            showMessage(
                "❌ " +
                (error.message ||
                "Login failed."),
                "error"
            );


            loginBtn.disabled =
                false;

            loginBtn.textContent =
                "🔐 Login";

            loading.style.display =
                "none";

        }

    }
);


/* =====================================
   CHECK EXISTING SESSION
===================================== */

async function checkExistingLogin(){

    try{

        const {
            data
        } =
        await db.auth.getSession();


        if(
            data &&
            data.session &&
            data.session.user
        ){

            const userId =
                data.session.user.id;


            const {
                data:profile
            } =
            await db
            .from("profiles")
            .select("role")
            .eq("id",userId)
            .maybeSingle();


            if(
                profile &&
                profile.role === "admin"
            ){

                showMessage(
                    "Already logged in. Opening Admin Panel...",
                    "success"
                );


                setTimeout(function(){

                    window.location.href =
                        "admin.html";

                },700);

            }

        }

    }

    catch(error){

        console.log(
            "Session check:",
            error
        );

    }

}


/* =====================================
   START
===================================== */

checkExistingLogin();

</script>

</body>
</html>
