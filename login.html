<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyHub Pakistan - Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#eff6ff,#f5f3ff);
    padding:20px;
}

.login-box{
    width:100%;
    max-width:410px;
    background:#fff;
    padding:35px;
    border-radius:18px;
    box-shadow:0 10px 40px rgba(0,0,0,.12);
}

.logo{
    text-align:center;
    font-size:26px;
    font-weight:bold;
    color:#172033;
    margin-bottom:8px;
}

.logo span{
    color:#2563eb;
}

.subtitle{
    text-align:center;
    color:#697386;
    margin-bottom:30px;
    font-size:14px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
    font-size:14px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #d5dbe7;
    border-radius:8px;
    outline:none;
    font-size:14px;
}

input:focus{
    border-color:#2563eb;
}

button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    margin-top:16px;
    padding:11px;
    border-radius:8px;
    text-align:center;
    font-size:13px;
    display:none;
}

.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#2563eb;
    text-decoration:none;
    font-size:14px;
}

.debug{
    margin-top:12px;
    padding:10px;
    background:#f1f5f9;
    border-radius:7px;
    font-size:11px;
    color:#475569;
    word-break:break-word;
    display:none;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        Study<span>Hub</span> Pakistan
    </div>

    <div class="subtitle">
        🔐 Admin Login
    </div>

    <form id="loginForm">

        <div class="form-group">
            <label>Email</label>

            <input
                id="email"
                type="email"
                placeholder="Enter admin email"
                autocomplete="email"
                required>
        </div>

        <div class="form-group">
            <label>Password</label>

            <input
                id="password"
                type="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required>
        </div>

        <button id="loginBtn" type="submit">
            🔐 Login
        </button>

    </form>

    <div id="message" class="message"></div>

    <div id="debug" class="debug"></div>

    <a href="index.html" class="back">
        ← Back to StudyHub
    </a>

</div>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://kwkxdvevtxyvjywiqkcv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5xL_Po0vDkNM_sMHz6zBTg_HhV1r0zT";

const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   ELEMENTS
========================================= */

const form =
document.getElementById("loginForm");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const message =
document.getElementById("message");

const debug =
document.getElementById("debug");


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;
}


/* =========================================
   DEBUG
========================================= */

function showDebug(text){

    debug.textContent = text;

    debug.style.display = "block";
}


/* =========================================
   LOGIN
========================================= */

form.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();

        message.className = "message";
        message.textContent = "";

        debug.style.display = "none";
        debug.textContent = "";

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;

        if(!email || !password){

            showMessage(
                "Email aur password enter karein.",
                "error"
            );

            return;
        }

        loginBtn.disabled = true;

        loginBtn.textContent =
            "⏳ Logging in...";

        try{

            /*
             * Agar purani session موجود hai
             * to pehle sign out kar dein.
             *
             * Is se har baar login form se
             * login karte waqt password required
             * rahega.
             */

            await db.auth.signOut();


            /* =================================
               SUPABASE LOGIN
            ================================= */

            const {
                data,
                error
            } = await db.auth.signInWithPassword({

                email:email,

                password:password

            });


            if(error){

                showMessage(
                    "❌ " + error.message,
                    "error"
                );

                showDebug(
                    "Supabase Auth: " +
                    error.message
                );

                loginBtn.disabled = false;

                loginBtn.textContent =
                    "🔐 Login";

                return;
            }


            if(!data || !data.user){

                throw new Error(
                    "User account nahi mila."
                );
            }


            /* =================================
               USER PROFILE
            ================================= */

            const userId =
                data.user.id;

            const {
                data:profile,
                error:profileError
            } = await db
                .from("profiles")
                .select("id,email,role")
                .eq("id",userId)
                .maybeSingle();


            if(profileError){

                await db.auth.signOut();

                showMessage(
                    "❌ Profile check failed.",
                    "error"
                );

                showDebug(
                    "Profile Error: " +
                    profileError.message +
                    " | Code: " +
                    (profileError.code || "unknown")
                );

                loginBtn.disabled = false;

                loginBtn.textContent =
                    "🔐 Login";

                return;
            }


            if(!profile){

                await db.auth.signOut();

                showMessage(
                    "❌ Admin profile not found.",
                    "error"
                );

                showDebug(
                    "No profile found for user ID: " +
                    userId
                );

                loginBtn.disabled = false;

                loginBtn.textContent =
                    "🔐 Login";

                return;
            }


            /* =================================
               ADMIN CHECK
            ================================= */

            if(
                String(profile.role)
                .trim()
                .toLowerCase() !== "admin"
            ){

                await db.auth.signOut();

                showMessage(
                    "❌ This account is not an admin.",
                    "error"
                );

                showDebug(
                    "Your role: " +
                    profile.role
                );

                loginBtn.disabled = false;

                loginBtn.textContent =
                    "🔐 Login";

                return;
            }


            /* =================================
               SUCCESS
            ================================= */

            showMessage(
                "✅ Login successful! Opening Admin Panel...",
                "success"
            );


            /*
             * Session Supabase mein maintain hogi.
             * Admin Panel refresh par bhi login
             * check karega.
             *
             * Logout karne par session completely
             * sign out ho jayegi.
             */

            setTimeout(function(){

                window.location.href =
                    "admin.html";

            },700);

        }

        catch(error){

            console.error(
                "LOGIN ERROR:",
                error
            );

            showMessage(
                "❌ Login failed.",
                "error"
            );

            showDebug(
                error.message ||
                String(error)
            );

            loginBtn.disabled = false;

            loginBtn.textContent =
                "🔐 Login";
        }

    }
);

</script>

</body>
</html>
