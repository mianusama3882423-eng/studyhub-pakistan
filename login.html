<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyHub Pakistan - Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#eff6ff,#f5f3ff);
    padding:20px;
}

.login-box{
    width:100%;
    max-width:400px;
    background:white;
    padding:35px;
    border-radius:18px;
    box-shadow:0 10px 40px rgba(0,0,0,.12);
}

.logo{
    text-align:center;
    font-size:25px;
    font-weight:bold;
    color:#172033;
    margin-bottom:8px;
}

.logo span{
    color:#2563eb;
}

.subtitle{
    text-align:center;
    color:#697386;
    margin-bottom:30px;
    font-size:14px;
}

label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
    font-size:14px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #d5dbe7;
    border-radius:8px;
    outline:none;
    margin-bottom:18px;
}

input:focus{
    border-color:#2563eb;
}

button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

.message{
    margin-top:15px;
    text-align:center;
    font-size:13px;
    color:#dc2626;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#2563eb;
    text-decoration:none;
    font-size:14px;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        Study<span>Hub</span> Pakistan
    </div>

    <div class="subtitle">
        Login to your account
    </div>

    <form id="loginForm">

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <button id="loginBtn" type="submit">
            Login
        </button>

    </form>

    <div id="message" class="message"></div>

    <a href="index.html" class="back">
        ← Back to StudyHub
    </a>

</div>

<script>

const SUPABASE_URL =
"https://kwkxdvevtxyvjywiqkcv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5xL_Po0vDkNM_sMHz6zBTg_HhV1r0zT";

const form =
document.getElementById("loginForm");

const message =
document.getElementById("message");

const button =
document.getElementById("loginBtn");


form.addEventListener("submit", async function(e){

    e.preventDefault();

    message.textContent = "";
    button.disabled = true;
    button.textContent = "Logging in...";

    const email =
    document.getElementById("email").value.trim();

    const password =
    document.getElementById("password").value;

    try{

        const response = await fetch(
            SUPABASE_URL +
            "/auth/v1/token?grant_type=password",
            {
                method:"POST",

                headers:{
                    "apikey":SUPABASE_KEY,
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    email:email,
                    password:password
                })
            }
        );

        const data = await response.json();

        if(!response.ok){

            throw new Error(
                data.error_description ||
                data.msg ||
                "Login failed"
            );
        }

        const accessToken =
        data.access_token;

        const profileResponse =
        await fetch(
            SUPABASE_URL +
            "/rest/v1/profiles?select=id,email,role&id=eq." +
            data.user.id,

            {
                headers:{
                    "apikey":SUPABASE_KEY,
                    "Authorization":
                    "Bearer " + accessToken
                }
            }
        );

        const profiles =
        await profileResponse.json();

        if(
            !profiles.length ||
            profiles[0].role !== "admin"
        ){

            throw new Error(
                "This account is not an admin."
            );
        }

        localStorage.setItem(
            "studyhub_access_token",
            accessToken
        );

        localStorage.setItem(
            "studyhub_user_id",
            data.user.id
        );

        localStorage.setItem(
            "studyhub_role",
            "admin"
        );

        window.location.href = "admin.html";

    }catch(error){

        console.error(error);

        message.textContent =
        "❌ " + error.message;

        button.disabled = false;
        button.textContent = "Login";
    }

});

</script>

</body>
</html>
